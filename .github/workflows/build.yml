# naught CI（M8）：三平台构建 + 自测。macOS 产物留档（未公证，仅供自用）。
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            qt: 6.9.3
            extra: ""
          - os: ubuntu-22.04
            qt: 6.9.3
            extra: "libgl1-mesa-dev libxkbcommon-x11-0"
          - os: windows-2022
            qt: 6.9.3
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true
          # qt_add_shaders/qsb 在独立模块里，qtbase 不带
          modules: qtshadertools
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.extra }}
      - name: Configure
        # install-qt-action 只导出 QT_ROOT_DIR，不导出 CMAKE_PREFIX_PATH
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        # --config Release：VS 多配置生成器默认 Debug
        run: cmake --build build --parallel --config Release > build.log 2>&1
      - name: Build diagnostics (on failure)
        if: failure()
        run: |
          grep -iE "error:|fatal error|undefined reference|error C[0-9]|error MSB|LNK[0-9]" build.log | tail -10 | awk '{print "::error::" $0}'
          tail -8 build.log | awk '{print "::error::" $0}'
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/naught.app/Contents/MacOS/naught --selftest > selftest.log 2>&1 || { tail -30 selftest.log | awk '{print "::error::" $0}'; exit 1; }
      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./build/naught --selftest > selftest.log 2>&1 || { tail -30 selftest.log | awk '{print "::error::" $0}'; exit 1; }
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen ./build/Release/naught.exe --selftest > selftest.log 2>&1 || { tail -30 selftest.log | awk '{print "::error::" $0}'; exit 1; }
