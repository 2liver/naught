# naught CI（M8）：三平台构建 + 自测。macOS 产物留档（未公证，仅供自用）。
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            qt: 6.9.3
            extra: ""
          - os: ubuntu-22.04
            qt: 6.9.3
            # mesa-vulkan-drivers=lavapipe 软件 Vulkan（无 GPU 跑者上 CRT 管线唯一可用后端）
            extra: "libgl1-mesa-dev libxkbcommon-x11-0 mesa-vulkan-drivers libvulkan1"
          - os: windows-2022
            qt: 6.9.3
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true
          # qt_add_shaders/qsb 在独立模块里，qtbase 不带
          modules: qtshadertools
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.extra }}
      - name: Configure
        # install-qt-action 只导出 QT_ROOT_DIR，不导出 CMAKE_PREFIX_PATH
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        # --config Release：VS 多配置生成器默认 Debug
        run: cmake --build build --parallel --config Release > build.log 2>&1
      - name: Build diagnostics (on failure)
        if: failure()
        run: |
          echo "::error::BUILD FAILED — log tail:"
          grep -iE "error|fatal|undefined" build.log | tail -3 | awk '{print "::error::" $0}'
          tail -5 build.log | awk '{print "::warning::" $0}'
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/naught.app/Contents/MacOS/naught --selftest > selftest.log 2>&1 || { rc=$?; echo "::error::SELFTEST FAILED rc=$rc"; grep -iE "selftest FAIL" selftest.log | tail -2 | awk '{print "::error::" $0}'; tail -3 /tmp/naught-crt-shader.log 2>/dev/null | awk '{print "::error::shader-log:" $0}'; tail -6 selftest.log | awk '{print "::warning::" $0}'; exit $rc; }
      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen NAUGHT_RHI_SKIP=vulkan,gles2 ./build/naught --selftest > selftest.log 2>&1 || { rc=$?; echo "::error::SELFTEST FAILED rc=$rc"; grep -iE "selftest FAIL" selftest.log | tail -2 | awk '{print "::error::" $0}'; tail -3 /tmp/naught-crt-shader.log 2>/dev/null | awk '{print "::error::shader-log:" $0}'; tail -6 selftest.log | awk '{print "::warning::" $0}'; exit $rc; }
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:NAUGHT_RHI_SKIP = 'vulkan,d3d11,d3d12'
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = '1'
          $p = Start-Process -FilePath '.\build\Release\naught.exe' -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          "::error::SELFTEST raw exit code: $($p.ExitCode)"
          if (Test-Path selftest.err) { Get-Content selftest.err -Tail 6 | ForEach-Object { "::warning::$_" } }
          if (Test-Path selftest.out) { Get-Content selftest.out -Tail 6 | ForEach-Object { "::warning::$_" } }
          if ($p.ExitCode -ne 0) { exit 1 }
