name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - os: windows-latest
            cmake_args: ""
          - os: ubuntu-latest
            cmake_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          cache: true
          # qt_add_shaders/qsb 在独立模块里，qtbase 不带
          modules: qtshadertools

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 mesa-vulkan-drivers libvulkan1

      - name: Build KF6 syntax-highlighting
        shell: bash
        run: |
          set -e
          PREFIX="$RUNNER_TEMP/kf6"
          git clone --depth 1 --quiet https://github.com/KDE/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          git clone --depth 1 --quiet https://github.com/KDE/syntax-highlighting.git "$RUNNER_TEMP/sh"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm-build" -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build "$RUNNER_TEMP/ecm-build" --config Release --target install
          ARCH_ARGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"; fi
          cmake -S "$RUNNER_TEMP/sh" -B "$RUNNER_TEMP/sh-build" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX;$QT_ROOT_DIR" $ARCH_ARGS
          cmake --build "$RUNNER_TEMP/sh-build" --config Release --target install --parallel

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/kf6;${{ env.QT_ROOT_DIR }}" ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel > build.log 2>&1

      - name: Build diagnostics (on failure)
        if: failure()
        run: |
          echo "::error::BUILD FAILED — log tail:"
          grep -iE "error|fatal|undefined" build.log | tail -3 | awk '{print "::error::" $0}'
          tail -5 build.log | awk '{print "::warning::" $0}'

      - name: Verify deployment target (macOS)
        if: runner.os == 'macOS'
        run: |
          MINOS=$(vtool -show-build build/naught.app/Contents/MacOS/naught | sed -n 's/.*minos \([0-9.]*\)/\1/p' | head -1)
          echo "app minos=$MINOS (want 12.0)"
          [ "$MINOS" = "12.0" ] || exit 1

      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          NAUGHT_RHI_SKIP: vulkan
        run: ./build/naught.app/Contents/MacOS/naught --selftest > selftest.log 2>&1 || { rc=$?; echo "::error::SELFTEST FAILED rc=$rc"; grep -iE "selftest FAIL" selftest.log | tail -2 | awk '{print "::error::" $0}'; tail -6 selftest.log | awk '{print "::warning::" $0}'; tail -3 /tmp/naught-crt-shader.log 2>/dev/null | awk '{print "::error::shader-log:" $0}'; exit $rc; }

      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          NAUGHT_RHI_SKIP: vulkan,gles2
        run: ./build/naught --selftest > selftest.log 2>&1 || { rc=$?; echo "::error::SELFTEST FAILED rc=$rc"; grep -iE "selftest FAIL" selftest.log | tail -2 | awk '{print "::error::" $0}'; tail -6 selftest.log | awk '{print "::warning::" $0}'; tail -3 /tmp/naught-crt-shader.log 2>/dev/null | awk '{print "::error::shader-log:" $0}'; exit $rc; }

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:NAUGHT_RHI_SKIP = 'vulkan,d3d11,d3d12,gles2'
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = '1'
          $p = Start-Process -FilePath '.\build\Release\naught.exe' -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          "::error::SELFTEST raw exit code: $($p.ExitCode)"
          if (Test-Path selftest.err) { Get-Content selftest.err -Tail 6 | ForEach-Object { "::warning::$_" } }
          if (Test-Path selftest.out) { Get-Content selftest.out -Tail 6 | ForEach-Object { "::warning::$_" } }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package macOS (zip + dmg)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/naught.app
          DYLIB=$(ls "$RUNNER_TEMP"/kf6/lib/libKF6SyntaxHighlighting.*.dylib | head -1)
          cp "$DYLIB" build/naught.app/Contents/Frameworks/
          BASE=$(basename "$DYLIB")
          LOAD=$(otool -L build/naught.app/Contents/MacOS/naught | grep KF6Syntax | awk '{print $1}')
          install_name_tool -change "$LOAD" "@executable_path/../Frameworks/$BASE" build/naught.app/Contents/MacOS/naught
          install_name_tool -id "@executable_path/../Frameworks/$BASE" "build/naught.app/Contents/Frameworks/$BASE"
          MINOS_KF6=$(vtool -show-build "build/naught.app/Contents/Frameworks/$BASE" | sed -n 's/.*minos \([0-9.]*\)/\1/p' | head -1)
          echo "kf6 minos=$MINOS_KF6 (want 12.0)"
          [ "$MINOS_KF6" = "12.0" ] || exit 1
          ditto -c -k --keepParent build/naught.app naught-macos.zip
          hdiutil create -volname "naught" -srcfolder build/naught.app -ov -format UDZO naught-macos.dmg

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          windeployqt build\Release\naught.exe
          Copy-Item "$env:RUNNER_TEMP\kf6\bin\KF6SyntaxHighlighting.dll" build\Release\
          Compress-Archive -Path build\Release\* -DestinationPath naught-windows.zip

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/naught \
            --desktop-file resources/linux/naught.desktop --icon-file resources/icons/naught.png \
            --plugin qt --output appimage
          find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -exec mv {} naught-linux.AppImage \;

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            naught-macos.dmg
            naught-macos.zip
            naught-windows.zip
            naught-linux.AppImage
          fail_on_unmatched_files: false
